[project]
name = "qwen-jax"
version = "0.1.0"
description = "Qwen3-VL vision-language model in JAX/Equinox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax[cuda12]>=0.8.2",
    "equinox",
    "bitsandbytes-jax @ git+https://github.com/nshepperd/bitsandbytes-jax.git@main",
    "flash_attn_jax==0.6.2",
    "transformers>=5.3.0",
    "einops",
    "jax-tqdm",
    "pydantic",
]

[dependency-groups]
test = [
    "pytest",
    "Pillow",
    "accelerate",
    "ipykernel",
    "ipywidgets",
    "pip",
    "lovely-tensors",
    "lovely-jax",
    "torchvision",
    "treescope",
    "optax",
    "wandb",
    "hypothesis",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_jax"]

[tool.ruff.lint]
# jaxtyping shape strings (e.g. Float[Array, "batch seq"]) sit inside annotations,
# so ruff reads them as forward references and misjudges them:
#   F722/F821 - "batch seq" is not valid Python / `batch` is undefined.
#   UP037     - under PEP 563 it thinks the quotes are redundant, but unquoting
#               breaks typing.get_type_hints (see utils/buffer.resolved_fields).
ignore = ["F722", "F821", "UP037"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.hatch]
metadata.allow-direct-references = true

[tool.ty.environment]
root = ["./src/"]