[project]
name = "qwen-jax"
version = "0.1.0"
description = "Qwen3-VL vision-language model in JAX/Equinox"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.8.2",
    # 0.13.8 added a typed Module.__new__, without which type checkers infer
    # every `SomeModule(...)` as bare `Module`.
    "equinox>=0.13.8",
    "bitsandbytes-jax @ git+https://github.com/nshepperd/bitsandbytes-jax.git@main",
    "fa4-jax @ git+https://github.com/nshepperd/fa4-jax.git@main",
    "gguf-jax @ git+https://github.com/nshepperd/gguf-jax.git@main",
    "transformers>=5.3.0",
    "einops",
    "jax-tqdm",
    "pydantic",
]

[dependency-groups]
test = [
    "pytest",
    "Pillow",
    "accelerate",
    "ipykernel",
    "ipywidgets",
    "pip",
    "lovely-tensors",
    "lovely-jax",
    "torchvision",
    "treescope",
    "optax",
    "wandb",
    "hypothesis",
    "pyarrow>=25.0.1",
    "sentencepiece>=0.2.2",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_jax"]

[tool.ruff.lint]
# jaxtyping shape strings (e.g. Float[Array, "batch seq"]) sit inside annotations,
# so ruff reads them as forward references and misjudges them:
#   F722/F821 - "batch seq" is not valid Python / `batch` is undefined.
#   UP037     - under PEP 563 it thinks the quotes are redundant, but unquoting
#               breaks typing.get_type_hints.
ignore = ["F722", "F821", "UP037"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.hatch]
metadata.allow-direct-references = true

[tool.ty.environment]
root = ["./src/"]
[tool.uv.sources]
# gguf-jax = { path = "../gguf-jax", editable = true }

[tool.uv]
# cutejax is newly published on PyPI, so it sits inside the global
# exclude-newer window; let it through.
exclude-newer-package = { cutejax = "2100-01-01" }
# jax 0.12 is the first release whose XLA gives host<->device copies their own
# stream (openxla/xla#49046), which weight streaming from pinned_host needs to
# overlap copies with compute.
#
# jax-tvm-ffi stays pinned: the CuTe kernels need a jax-tvm-ffi whose FFI
# registration reaches jaxlib's table. 0.1.2 does (on 0.8.x and 0.11.x); with
# 0.1.3 on 0.8.x every kernel registered into tvm-ffi's own table instead, and
# each call died with "No FFI handler registered for cutejax.<kernel> on a
# platform CUDA" -- silent until the first fused matmul runs.
override-dependencies = [
    "jax[cuda13]>=0.12.0",
    "jax-tvm-ffi==0.1.2",
]
